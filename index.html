<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nauta · Implementation Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --nauta-blue:    #4A6CF7;
  --nauta-blue-d:  #2F4ED4;
  --nauta-dark:    #0F1B3D;
  --nauta-bg:      #F5F7FB;
  --nauta-card:    #FFFFFF;
  --nauta-border:  #E2E7F1;
  --nauta-text:    #1A2540;
  --nauta-muted:   #6B7380;
  --ok:    #16A34A;
  --wip:   #4A6CF7;
  --blk:   #DC2626;
  --pen:   #D97706;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  background: var(--nauta-bg);
  color: var(--nauta-text);
  font-size: 14px;
  line-height: 1.5;
}
a { color: var(--nauta-blue); text-decoration: none; }

.topbar {
  background: var(--nauta-dark);
  color: white;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 1px 6px rgba(15,27,61,0.12);
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand img.logo {
  height: 28px;
  width: auto;
  display: block;
}
.brand .divider {
  width: 1px;
  height: 18px;
  background: rgba(255,255,255,0.18);
}
.brand .product {
  font-weight: 600;
  font-size: 12px;
  color: rgba(255,255,255,0.78);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.topbar-stats {
  display: flex;
  gap: 24px;
  font-size: 12px;
}
.topbar-stats span b { color: white; font-weight: 700; }
.topbar-stats span { color: rgba(255,255,255,0.65); }

.layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  height: calc(100vh - 56px);
}

.sidebar {
  background: var(--nauta-card);
  border-right: 1px solid var(--nauta-border);
  overflow-y: auto;
  padding: 16px 0;
}
.sidebar h3 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--nauta-muted);
  padding: 0 20px 8px;
  font-weight: 700;
}
.client-item {
  padding: 12px 20px;
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background 0.15s;
}
.client-item:hover { background: var(--nauta-bg); }
.client-item.active {
  background: var(--nauta-bg);
  border-left-color: var(--nauta-blue);
}
.client-item .name {
  font-weight: 600;
  font-size: 13px;
  color: var(--nauta-text);
  margin-bottom: 4px;
}
.client-item .meta {
  font-size: 11px;
  color: var(--nauta-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.bar {
  width: 100%;
  height: 4px;
  background: var(--nauta-border);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 6px;
}
.bar > div { height: 100%; background: var(--nauta-blue); }

.main {
  overflow-y: auto;
  padding: 28px 36px;
}
.client-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--nauta-border);
}
.client-header h1 {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.client-header .sub {
  color: var(--nauta-muted);
  font-size: 13px;
}
.client-header .progress {
  text-align: right;
  min-width: 200px;
}
.client-header .progress .pct {
  font-size: 32px;
  font-weight: 800;
  color: var(--nauta-blue);
}
.client-header .progress .lbl {
  font-size: 11px;
  color: var(--nauta-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
.card {
  background: var(--nauta-card);
  border: 1px solid var(--nauta-border);
  border-radius: 12px;
  padding: 16px;
}
.card h4 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--nauta-muted);
  margin-bottom: 8px;
  font-weight: 700;
}
.card .val { font-size: 16px; font-weight: 600; color: var(--nauta-text); }
.card .val.muted { color: var(--nauta-muted); font-weight: 400; font-style: italic; }

.section {
  background: var(--nauta-card);
  border: 1px solid var(--nauta-border);
  border-radius: 12px;
  margin-bottom: 16px;
  overflow: hidden;
}
.section header {
  padding: 14px 18px;
  background: var(--nauta-card);
  border-bottom: 1px solid var(--nauta-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.section header h3 { font-size: 14px; font-weight: 700; }
.section header .count {
  background: var(--nauta-bg);
  border-radius: 99px;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--nauta-muted);
}
.section .body { padding: 4px 0; }
.section ul { list-style: none; }
.section ul li {
  padding: 10px 18px;
  border-bottom: 1px solid var(--nauta-bg);
  font-size: 13px;
}
.section ul li:last-child { border-bottom: none; }

table.tasks {
  width: 100%;
  border-collapse: collapse;
}
table.tasks thead th {
  text-align: left;
  padding: 10px 14px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--nauta-muted);
  background: var(--nauta-bg);
  font-weight: 700;
  border-bottom: 1px solid var(--nauta-border);
}
table.tasks tbody td {
  padding: 10px 14px;
  font-size: 13px;
  border-bottom: 1px solid var(--nauta-bg);
  vertical-align: top;
}
table.tasks tbody tr:last-child td { border-bottom: none; }
table.tasks tbody tr:hover { background: var(--nauta-bg); }
.pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
}
.pill.ok  { background: rgba(22,163,74,0.12);  color: var(--ok); }
.pill.wip { background: rgba(74,108,247,0.12); color: var(--wip); }
.pill.blk { background: rgba(220,38,38,0.12);  color: var(--blk); }
.pill.pen { background: rgba(217,119,6,0.12);  color: var(--pen); }

.empty {
  padding: 28px;
  color: var(--nauta-muted);
  font-style: italic;
  font-size: 13px;
  text-align: center;
}

.stage-chip {
  display: inline-block;
  background: rgba(74,108,247,0.10);
  color: var(--nauta-blue);
  font-weight: 600;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 99px;
}
.handover-chip {
  display: inline-block;
  background: rgba(22,163,74,0.12);
  color: var(--ok);
  font-weight: 600;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 99px;
  margin-left: 6px;
}

footer {
  padding: 16px 28px;
  font-size: 11px;
  color: var(--nauta-muted);
  text-align: center;
  border-top: 1px solid var(--nauta-border);
  background: var(--nauta-card);
}
</style>
</head>

function statusClass(s) {
  s = (s || '').toLowerCase();
  if (s.includes('complet') || s.includes('done') || s.includes('ready')) return 'ok';
  if (s.includes('progreso') || s.includes('progress')) return 'wip';
  if (s.includes('bloque') || s.includes('blocked')) return 'blk';
  return 'pen';
}

function esc(s) {
  return (s||'').toString()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderSidebar(activeK) {
  const list = document.getElementById('client-list');
  list.innerHTML = DATA.map(c => `
    <div class="client-item ${c.k === activeK ? 'active' : ''}" data-k="${c.k}">
      <div class="name">${esc(c.n)}</div>
      <div class="meta">
        <span>${esc(c.st)}</span>
        <span><b>${c.p}%</b></span>
      </div>
      <div class="bar"><div style="width:${c.p}%"></div></div>
    </div>
  `).join('');
  list.querySelectorAll('.client-item').forEach(el => {
    el.addEventListener('click', () => renderClient(el.dataset.k));
  });
}

function renderClient(k) {
  const c = DATA.find(x => x.k === k);
  if (!c) return;
  renderSidebar(k);
  const m = document.getElementById('main');
  const handoverChip = c.handover ? `<span class="handover-chip">${esc(c.handover)}</span>` : '';

  // Always-shown cards: etapa + blocker (con "sin bloqueos" cuando vacío es útil).
  // Resto: solo se muestran si tienen valor real.
  const cards = [
    { h: 'Etapa', v: `<span class="stage-chip">${esc(c.st)}</span>${handoverChip}`, always: true },
    { h: 'OB Lead',           v: esc(c.ob_lead) },
    { h: 'KAM',               v: esc(c.kam) },
    { h: 'Blocker principal', v: esc(c.blocker) || '<span class="val muted">sin bloqueos</span>', always: true },
    { h: 'Siguiente acción',  v: esc(c.next_action) },
    { h: 'Pain points',       v: esc(c.pain_points) },
  ].filter(x => x.always || (x.v && x.v.trim()));
  const cardsHTML = cards.map(x => `
    <div class="card"><h4>${x.h}</h4><div class="val">${x.v}</div></div>`).join('');

  // Sections (Next steps / Riesgos / Last week): si no hay items, no se renderiza la sección.
  function section(title, items) {
    if (!items.length) return '';
    return `
      <div class="section">
        <header><h3>${title}</h3><span class="count">${items.length}</span></header>
        <div class="body"><ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
      </div>`;
  }

  const tasks = (c.tasks || []).slice().sort((a,b) => {
    const ra = statusClass(a.s) === 'ok' ? 1 : 0;
    const rb = statusClass(b.s) === 'ok' ? 1 : 0;
    if (ra !== rb) return ra - rb;
    return (a.d || '').localeCompare(b.d || '');
  });

  const tasksHTML = tasks.length ? `
    <div class="section">
      <header><h3>Tareas</h3><span class="count">${tasks.length}</span></header>
      <table class="tasks">
        <thead><tr>
          <th>Tarea</th><th>Resp.</th><th>Owner</th>
          <th>Due</th><th>Status</th>
        </tr></thead>
        <tbody>
          ${tasks.map(t => `
            <tr>
              <td>${esc(t.t)}</td>
              <td>${esc(t.r)}</td>
              <td>${esc(t.o)}</td>
              <td>${esc(t.d)}</td>
              <td><span class="pill ${statusClass(t.s)}">${esc(t.s || '—')}</span></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>` : '';

  m.innerHTML = `
    <div class="client-header">
      <div>
        <h1>${esc(c.n)}</h1>
        <div class="sub">${esc(c.st)} · ${esc(c.sx)} · ${c.task_count} tareas (${c.open_task_count} abiertas)</div>
      </div>
      <div class="progress">
        <div class="pct">${c.p}%</div>
        <div class="lbl">Avance</div>
      </div>
    </div>
    <div class="cards">${cardsHTML}</div>
    ${section('Next steps',  c.next_steps)}
    ${section('Riesgos',     c.risks)}
    ${section('Last week',   c.last_week)}
    ${tasksHTML}
  `;
  m.scrollTop = 0;
}

if (DATA.length) renderClient(DATA[0].k);
else document.getElementById('main').innerHTML = '<div class="empty">Sin clientes para mostrar.</div>';
</script>
