<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nauta · Implementation Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --nauta-blue:    #4A6CF7;
  --nauta-blue-d:  #2F4ED4;
  --nauta-dark:    #0F1B3D;
  --nauta-bg:      #F5F7FB;
  --nauta-card:    #FFFFFF;
  --nauta-border:  #E2E7F1;
  --nauta-text:    #1A2540;
  --nauta-muted:   #6B7380;
  --ok:    #16A34A;
  --wip:   #4A6CF7;
  --blk:   #DC2626;
  --pen:   #D97706;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  background: var(--nauta-bg);
  color: var(--nauta-text);
  font-size: 14px;
  line-height: 1.5;
}
a { color: var(--nauta-blue); text-decoration: none; }

.topbar {
  background: var(--nauta-dark);
  color: white;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 1px 6px rgba(15,27,61,0.12);
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand img.logo { height: 28px; width: auto; display: block; }
.brand .divider { width: 1px; height: 18px; background: rgba(255,255,255,0.18); }
.brand .product {
  font-weight: 600; font-size: 12px;
  color: rgba(255,255,255,0.78);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.topbar-stats { display: flex; gap: 24px; font-size: 12px; }
.topbar-stats span b { color: white; font-weight: 700; }
.topbar-stats span { color: rgba(255,255,255,0.65); }

.layout {
  display: grid;
  grid-template-columns: 300px 1fr;
  height: calc(100vh - 56px);
}

.sidebar {
  background: var(--nauta-card);
  border-right: 1px solid var(--nauta-border);
  overflow-y: auto;
  padding: 16px 0;
}
.sidebar h3 {
  font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--nauta-muted);
  padding: 0 20px 8px; font-weight: 700;
}
.client-item {
  padding: 12px 20px;
  border-left: 3px solid transparent;
  cursor: pointer; transition: background 0.15s;
}
.client-item:hover { background: var(--nauta-bg); }
.client-item.active {
  background: var(--nauta-bg);
  border-left-color: var(--nauta-blue);
}
.client-item .name {
  font-weight: 600; font-size: 13px;
  color: var(--nauta-text); margin-bottom: 4px;
}
.client-item .meta {
  font-size: 11px; color: var(--nauta-muted);
  display: flex; justify-content: space-between; align-items: center;
}
.client-item .ho-date {
  font-size: 11px; color: var(--nauta-muted);
  margin-top: 4px; font-weight: 500;
}
.bar {
  width: 100%; height: 4px;
  background: var(--nauta-border);
  border-radius: 99px; overflow: hidden;
  margin-top: 6px;
}
.bar > div { height: 100%; background: var(--nauta-blue); }

.main { overflow-y: auto; padding: 28px 36px; }

.client-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--nauta-border);
}
.client-header h1 {
  font-size: 26px; font-weight: 800;
  letter-spacing: -0.02em; margin-bottom: 6px;
}
.client-header .sub { color: var(--nauta-muted); font-size: 13px; }
.client-header .progress { text-align: right; min-width: 200px; }
.client-header .progress .pct {
  font-size: 32px; font-weight: 800;
  color: var(--nauta-blue);
}
.client-header .progress .lbl {
  font-size: 11px; color: var(--nauta-muted);
  text-transform: uppercase; letter-spacing: 0.06em;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px; margin-bottom: 24px;
}
.card {
  background: var(--nauta-card);
  border: 1px solid var(--nauta-border);
  border-radius: 12px; padding: 16px;
}
.card.highlight {
  background: linear-gradient(135deg, rgba(74,108,247,0.08) 0%, rgba(74,108,247,0.02) 100%);
  border-color: rgba(74,108,247,0.3);
}
.card h4 {
  font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--nauta-muted);
  margin-bottom: 8px; font-weight: 700;
}
.card .val { font-size: 16px; font-weight: 600; color: var(--nauta-text); }
.card .val.big { font-size: 18px; font-weight: 700; color: var(--nauta-blue); }
.card .val.muted { color: var(--nauta-muted); font-weight: 400; font-style: italic; }

.section {
  background: var(--nauta-card);
  border: 1px solid var(--nauta-border);
  border-radius: 12px;
  margin-bottom: 16px;
  overflow: hidden;
}
.section.feature {
  border-color: rgba(74,108,247,0.4);
  box-shadow: 0 2px 12px rgba(74,108,247,0.06);
}
.section header {
  padding: 14px 18px;
  background: var(--nauta-card);
  border-bottom: 1px solid var(--nauta-border);
  display: flex; align-items: center; justify-content: space-between;
}
.section.feature header {
  background: linear-gradient(90deg, rgba(74,108,247,0.06) 0%, transparent 100%);
}
.section header h3 { font-size: 14px; font-weight: 700; }
.section.feature header h3 { color: var(--nauta-blue); font-size: 15px; }
.section header .count {
  background: var(--nauta-bg);
  border-radius: 99px; padding: 2px 10px;
  font-size: 12px; font-weight: 600; color: var(--nauta-muted);
}
.section .body { padding: 4px 0; }
.section ul { list-style: none; }
.section ul li {
  padding: 10px 18px;
  border-bottom: 1px solid var(--nauta-bg);
  font-size: 13px;
}
.section ul li:last-child { border-bottom: none; }

/* Feature list (Pains / KPI) — numbered items, clean spacing */
.feature-list { padding: 8px 0; }
.feature-item {
  display: flex;
  gap: 16px;
  padding: 18px 22px;
  border-bottom: 1px solid var(--nauta-bg);
}
.feature-item:last-child { border-bottom: none; }
.feature-num {
  flex-shrink: 0;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: rgba(74,108,247,0.10);
  color: var(--nauta-blue);
  font-weight: 700;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.feature-content { flex: 1; min-width: 0; }
.feature-main {
  font-size: 14px;
  font-weight: 600;
  color: var(--nauta-text);
  line-height: 1.45;
  margin-bottom: 4px;
}
.feature-arrow {
  font-size: 13px;
  color: var(--nauta-muted);
  line-height: 1.55;
  padding-left: 14px;
  border-left: 2px solid rgba(74,108,247,0.25);
  margin-top: 6px;
}
.feature-baseline {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  padding: 4px 10px 4px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid transparent;
}
.feature-baseline.state-ok  { background: rgba(22,163,74,0.10);  color: var(--ok);  border-color: rgba(22,163,74,0.25); }
.feature-baseline.state-wip { background: rgba(217,119,6,0.10);  color: var(--pen); border-color: rgba(217,119,6,0.25); }
.feature-baseline.state-pen { background: rgba(220,38,38,0.08);  color: var(--blk); border-color: rgba(220,38,38,0.20); }
.feature-baseline.state-blk { background: rgba(74,108,247,0.10); color: var(--wip); border-color: rgba(74,108,247,0.25); }
.feature-baseline .baseline-status {
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 10px;
  opacity: 0.85;
}
.feature-baseline .baseline-value {
  font-weight: 600;
}
.feature-baseline .baseline-value:empty { display: none; }

/* Baseline legend */
.baseline-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
  padding: 10px 14px;
  background: var(--nauta-card);
  border: 1px solid var(--nauta-border);
  border-radius: 10px;
  font-size: 11.5px;
}
.baseline-legend .legend-title {
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--nauta-muted);
  font-size: 10.5px;
  margin-right: 6px;
  align-self: center;
}
.baseline-legend .legend-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--nauta-bg);
  color: var(--nauta-text);
  font-weight: 500;
}
.feature-subs {
  margin-top: 8px;
  padding-left: 0;
  list-style: none;
}
.feature-subs li {
  position: relative;
  padding: 3px 0 3px 16px;
  font-size: 12.5px;
  color: var(--nauta-muted);
  line-height: 1.5;
  border: none;
}
.feature-subs li:before {
  content: '·';
  position: absolute;
  left: 4px;
  color: var(--nauta-blue);
  font-weight: 700;
}

table.tasks { width: 100%; border-collapse: collapse; }
table.tasks thead th {
  text-align: left; padding: 10px 14px;
  font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--nauta-muted);
  background: var(--nauta-bg);
  font-weight: 700;
  border-bottom: 1px solid var(--nauta-border);
}
table.tasks tbody td {
  padding: 10px 14px; font-size: 13px;
  border-bottom: 1px solid var(--nauta-bg);
  vertical-align: top;
}
table.tasks tbody tr:last-child td { border-bottom: none; }
table.tasks tbody tr:hover { background: var(--nauta-bg); }
.pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
}
.pill.ok  { background: rgba(22,163,74,0.12);  color: var(--ok); }
.pill.wip { background: rgba(74,108,247,0.12); color: var(--wip); }
.pill.blk { background: rgba(220,38,38,0.12);  color: var(--blk); }
.pill.pen { background: rgba(217,119,6,0.12);  color: var(--pen); }

.empty {
  padding: 28px; color: var(--nauta-muted);
  font-style: italic; font-size: 13px; text-align: center;
}

.stage-chip {
  display: inline-block;
  background: rgba(74,108,247,0.10);
  color: var(--nauta-blue);
  font-weight: 600; font-size: 12px;
  padding: 4px 10px; border-radius: 99px;
}
.handover-chip {
  display: inline-block;
  background: rgba(22,163,74,0.12);
  color: var(--ok);
  font-weight: 600; font-size: 12px;
  padding: 4px 10px; border-radius: 99px;
  margin-left: 6px;
}
.status-chip {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 99px;
  font-size: 12px; font-weight: 600;
  margin-left: 6px;
}
.status-chip.ok  { background: rgba(22,163,74,0.12); color: var(--ok); }
.status-chip.wip { background: rgba(74,108,247,0.12); color: var(--wip); }
.status-chip.blk { background: rgba(220,38,38,0.12); color: var(--blk); }
.status-chip.pen { background: rgba(217,119,6,0.12); color: var(--pen); }

footer {
  padding: 16px 28px; font-size: 11px;
  color: var(--nauta-muted); text-align: center;
  border-top: 1px solid var(--nauta-border);
  background: var(--nauta-card);
}
</style>
</head>

function statusClass(s) {
  s = (s || '').toLowerCase();
  if (s.includes('complet') || s.includes('done') || s.includes('ready')) return 'ok';
  if (s.includes('progreso') || s.includes('progress')) return 'wip';
  if (s.includes('bloque') || s.includes('blocked')) return 'blk';
  return 'pen';
}

function esc(s) {
  return (s||'').toString()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderSidebar(activeK) {
  const list = document.getElementById('client-list');
  list.innerHTML = DATA.map(c => `
    <div class="client-item ${c.k === activeK ? 'active' : ''}" data-k="${c.k}">
      <div class="name">${esc(c.n)}</div>
      <div class="meta">
        <span>${esc(c.st)}</span>
        <span><b>${c.p}%</b></span>
      </div>
      ${c.target_ho ? `<div class="ho-date">Handover: ${esc(c.target_ho)}</div>` : ''}
      <div class="bar"><div style="width:${c.p}%"></div></div>
    </div>
  `).join('');
  list.querySelectorAll('.client-item').forEach(el => {
    el.addEventListener('click', () => renderClient(el.dataset.k));
  });
}

function renderClient(k) {
  const c = DATA.find(x => x.k === k);
  if (!c) return;
  renderSidebar(k);
  const m = document.getElementById('main');
  const handoverChip = c.handover ? `<span class="handover-chip">${esc(c.handover)}</span>` : '';
  const statusChipClass = statusClass(c.sx);
  const statusChip = c.sx ? `<span class="status-chip ${statusChipClass}">${esc(c.sx)}</span>` : '';

  // Highlight cards (always-shown): Etapa + Target Handover + Status
  const cards = [
    { h: 'Etapa', v: `<span class="stage-chip">${esc(c.st)}</span>${handoverChip}`, always: true, highlight: true },
    { h: 'Target Handover Externo', v: c.target_ho ? `<span class="val big">${esc(c.target_ho)}</span>` : '<span class="val muted">sin fecha</span>', always: true, highlight: true },
    { h: 'Status', v: c.sx ? `<span class="status-chip ${statusChipClass}">${esc(c.sx)}</span>` : '<span class="val muted">—</span>', always: true, highlight: true },
    { h: 'Go Live',           v: esc(c.go_live) },
    { h: 'KAM',               v: esc(c.kam) },
    { h: 'Siguiente acción',  v: esc(c.next_action) },
  ].filter(x => x.always || (x.v && x.v.trim()));
  const cardsHTML = cards.map(x => `
    <div class="card${x.highlight ? ' highlight' : ''}"><h4>${x.h}</h4><div class="val">${x.v}</div></div>`).join('');

  // Featured sections: Pains to solve + KPI (numbered items, clean)
  function featureSection(title, items) {
    if (!items || !items.length) return '';
    const rows = items.map(it => {
      const numLabel = it.n === '•' ? '•' : it.n;
      const arrow = it.arrow ? `<div class="feature-arrow">→ ${esc(it.arrow)}</div>` : '';
      const blValue = it.baseline ? esc(it.baseline) : '';
      const blEmoji = it.baseline_emoji || '';
      const blLabel = it.baseline_label || '';
      const blState = it.baseline_state || 'pen';
      const baseline = (blEmoji || blValue) ? `<div class="feature-baseline state-${blState}"><span>${blEmoji}</span><span class="baseline-status">${esc(blLabel)}</span>${blValue ? `<span class="baseline-value">· ${blValue}</span>` : ''}</div>` : '';
      const subs = (it.subs && it.subs.length)
        ? `<ul class="feature-subs">${it.subs.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`
        : '';
      return `
        <div class="feature-item">
          <span class="feature-num">${esc(numLabel)}</span>
          <div class="feature-content">
            <div class="feature-main">${esc(it.main)}</div>
            ${arrow}
            ${baseline}
            ${subs}
          </div>
        </div>`;
    }).join('');
    return `
      <div class="section feature">
        <header><h3>${title}</h3><span class="count">${items.length}</span></header>
        <div class="feature-list">${rows}</div>
      </div>`;
  }

  function section(title, items) {
    if (!items.length) return '';
    return `
      <div class="section">
        <header><h3>${title}</h3><span class="count">${items.length}</span></header>
        <div class="body"><ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
      </div>`;
  }

  const tasks = (c.tasks || []).slice().sort((a,b) => {
    const ra = statusClass(a.s) === 'ok' ? 1 : 0;
    const rb = statusClass(b.s) === 'ok' ? 1 : 0;
    if (ra !== rb) return ra - rb;
    return (a.d || '').localeCompare(b.d || '');
  });

  const tasksHTML = tasks.length ? `
    <div class="section">
      <header><h3>Tareas</h3><span class="count">${tasks.length}</span></header>
      <table class="tasks">
        <thead><tr>
          <th>Tarea</th><th>Resp.</th><th>Owner</th>
          <th>Due</th><th>Status</th>
        </tr></thead>
        <tbody>
          ${tasks.map(t => `
            <tr>
              <td>${esc(t.t)}</td>
              <td>${esc(t.r)}</td>
              <td>${esc(t.o)}</td>
              <td>${esc(t.d)}</td>
              <td><span class="pill ${statusClass(t.s)}">${esc(t.s || '—')}</span></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>` : '';

  m.innerHTML = `
    <div class="client-header">
      <div>
        <h1>${esc(c.n)}</h1>
        <div class="sub">${esc(c.st)} ${statusChip} · ${c.task_count} tareas (${c.open_task_count} abiertas)</div>
      </div>
      <div class="progress">
        <div class="pct">${c.p}%</div>
        <div class="lbl">Avance</div>
      </div>
    </div>
    <div class="cards">${cardsHTML}</div>
    ${featureSection('Pains to solve',  c.pains)}
    ${(c.kpi && c.kpi.length) ? `
    <div class="baseline-legend">
      <span class="legend-title">Estado Baseline:</span>
      <span class="legend-item">🟢 Confirmado</span>
      <span class="legend-item">🟡 A calibrar</span>
      <span class="legend-item">🟠 A capturar</span>
      <span class="legend-item">🔵 A tomar Sem 1 op</span>
    </div>` : ''}
    ${featureSection('KPI · Beneficio cliente', c.kpi)}
    ${section('Next steps',  c.next_steps)}
    ${section('Riesgos',     c.risks)}
    ${section('Last week',   c.last_week)}
    ${tasksHTML}
  `;
  m.scrollTop = 0;
}

if (DATA.length) renderClient(DATA[0].k);
else document.getElementById('main').innerHTML = '<div class="empty">Sin clientes para mostrar.</div>';
</script>

</body>
</html>
